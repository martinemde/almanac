name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install lint components for the project toolchain
        run: mise exec -- rustup component add rustfmt clippy
      - name: Lint, generated code, and offline tests
        run: mise exec -- make lint generated test check-public
      - name: Dependency policy
        run: mise exec -- cargo deny --locked check
